<!-- Importação da API do Google para contornar restrições de CORS -->
<script src="https://www.gstatic.com/charts/loader.js"></script>

<script>
    // CONFIGURAÇÃO
    const SPREADSHEET_ID = '1p0IHPneaj5v4VlrSbXkaSg5f9NSzBqT_qdUqu3A9Al0';
    const SHEET_NAME = 'Página1';

    // Carrega a biblioteca gráfica do Google necessária para ler o Sheets
    google.charts.load('current', { packages: ['corechart'] });

    const searchInput = document.getElementById('searchInput');
    const loadingEl = document.getElementById('loading');
    const resultsEl = document.getElementById('results');
    const emptyStateEl = document.getElementById('emptyState');

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function getStatusClass(status) {
        if (!status) return 'status-default';
        const s = status.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        if (s.includes('transito')) return 'status-em-transito';
        if (s.includes('pendente')) return 'status-pendente';
        if (s.includes('retido')) return 'status-retido';
        if (s.includes('extraviado') || s.includes('perdido')) return 'status-extraviado';
        return 'status-default';
    }

    function getInitials(name) {
        if (!name) return '?';
        const parts = name.trim().split(/\s+/);
        if (parts.length >= 2) return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
        return parts[0][0].toUpperCase();
    }

    // Atalho Enter
    searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') searchDOP();
    });

    // Converter para maiúsculas
    searchInput.addEventListener('input', () => {
        searchInput.value = searchInput.value.toUpperCase();
    });

    // Busca de dados utilizando a API nativa do Google Visualization
    function fetchSheetData() {
        return new Promise((resolve, reject) => {
            const queryUrl = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?sheet=${encodeURIComponent(SHEET_NAME)}&headers=1`;
            const query = new google.visualization.Query(queryUrl);

            query.send((response) => {
                if (response.isError()) {
                    reject(new Error(response.getMessage()));
                    return;
                }

                const dataTable = response.getDataTable();
                const numRows = dataTable.getNumberOfRows();
                const records = [];

                for (let i = 0; i < numRows; i++) {
                    records.push({
                        codigoDOP: (dataTable.getValue(i, 0) || '').toString().trim(),
                        nomeAgencia: (dataTable.getValue(i, 1) || '').toString().trim(),
                        codigoPacote: (dataTable.getValue(i, 2) || '').toString().trim(),
                        nomeComprador: (dataTable.getValue(i, 3) || '').toString().trim(),
                        statusPacote: (dataTable.getValue(i, 4) || '').toString().trim(),
                        telefone: (dataTable.getValue(i, 5) || '').toString().trim(),
                        acaoNecessaria: (dataTable.getValue(i, 6) || '').toString().trim(),
                    });
                }
                resolve(records);
            });
        });
    }

    async function searchDOP() {
        const query = searchInput.value.trim().toUpperCase();
        if (!query) {
            searchInput.focus();
            return;
        }

        // Reset UI
        resultsEl.innerHTML = '';
        resultsEl.classList.remove('active');
        emptyStateEl.classList.remove('active');
        loadingEl.classList.add('active');

        try {
            const allRecords = await fetchSheetData();
            const filtered = allRecords.filter(r => r.codigoDOP.toUpperCase() === query);

            loadingEl.classList.remove('active');

            if (filtered.length === 0) {
                emptyStateEl.classList.add('active');
                document.getElementById('emptyTitle').textContent = 'Nenhum resultado encontrado';
                document.getElementById('emptyMessage').textContent = `O código "${query}" não foi encontrado na base de dados. Verifique o código e tente novamente.`;
                return;
            }

            const agencyName = filtered[0].nomeAgencia || 'Agência não identificada';
            const totalPackages = filtered.length;

            // Agrupar por comprador
            const buyerMap = new Map();
            filtered.forEach(record => {
                const key = record.nomeComprador || 'Sem nome';
                if (!buyerMap.has(key)) {
                    buyerMap.set(key, {
                        name: record.nomeComprador,
                        phone: record.telefone,
                        packages: []
                    });
                }
                buyerMap.get(key).packages.push(record);
            });

            // Montar HTML do resultado
            let html = `
                <div class="agency-header glass">
                    <div class="agency-info">
                        <div class="agency-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                                <polyline points="9 22 9 12 15 12 15 22"/>
                            </svg>
                        </div>
                        <div>
                            <div class="agency-name">${escapeHtml(agencyName)}</div>
                            <div class="agency-code">DOP: ${escapeHtml(query)}</div>
                        </div>
                    </div>
                    <div class="total-badge">
                        <span class="number">${totalPackages}</span>
                        <span class="label">Pacotes em falta</span>
                    </div>
                </div>
            `;

            buyerMap.forEach((buyer) => {
                html += `
                    <div class="buyer-card glass">
                        <div class="buyer-header">
                            <div class="buyer-name-area">
                                <div class="buyer-avatar">${getInitials(buyer.name)}</div>
                                <div>
                                    <div class="buyer-name">${escapeHtml(buyer.name || 'Sem nome')}</div>
                                    <div class="buyer-phone">
                                        <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                                        ${escapeHtml(buyer.phone || 'Não informado')}
                                    </div>
                                </div>
                            </div>
                            <div class="buyer-count">${buyer.packages.length} pacote${buyer.packages.length > 1 ? 's' : ''}</div>
                        </div>
                        <table class="packages-table">
                            <thead>
                                <tr>
                                    <th>Código do Pacote</th>
                                    <th>Status</th>
                                    <th>Ação Necessária</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                buyer.packages.forEach(pkg => {
                    html += `
                        <tr>
                            <td>${escapeHtml(pkg.codigoPacote)}</td>
                            <td><span class="status-badge ${getStatusClass(pkg.statusPacote)}">${escapeHtml(pkg.statusPacote)}</span></td>
                            <td class="action-text">${escapeHtml(pkg.acaoNecessaria)}</td>
                        </tr>
                    `;
                });

                html += `
                            </tbody>
                        </table>
                    </div>
                `;
            });

            resultsEl.innerHTML = html;
            resultsEl.classList.add('active');

        } catch (error) {
            loadingEl.classList.remove('active');
            emptyStateEl.classList.add('active');
            document.getElementById('emptyTitle').textContent = 'Erro ao buscar dados';
            document.getElementById('emptyMessage').textContent = 'Não foi possível carregar as informações. Verifique a permissão do Google Sheets.';
            console.error('Erro na requisição:', error);
        }
    }
</script>
